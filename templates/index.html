<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <div class="logo">
        🏥 Disease Predictor
    </div>
</nav>

<div class="container">

    <div class="card">

        <h1>Disease Prediction System</h1>

        <form method="POST" action="/predict">

            <div class="form-group">
                <label>Fever</label>
                <select name="fever">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cough</label>
                <select name="cough">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Headache</label>
                <select name="headache">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fatigue</label>
                <select name="fatigue">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <button type="submit">
                Predict Disease
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            <h2>Prediction</h2>
            <p>{{ prediction }}</p>
        </div>
        {% endif %}

    </div>

</div>

<footer>
    © 2026 Disease Prediction System | Built with Flask & Scikit-Learn
</footer>

</body>
</html>
